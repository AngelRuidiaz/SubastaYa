services:
  base-de-datos:
    image: postgres:16
    container_name: subastaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: subastaya
      POSTGRES_PASSWORD: subastaya123
      POSTGRES_DB: subastaya
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data

volumes:
  datos-postgres:
